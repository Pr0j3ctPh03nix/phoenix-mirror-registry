name: publish

# Push to main -> build the mirror list, have it sealed, publish it as a Release.
#
# THE SIGNING KEY HAS LEFT THIS REPOSITORY, and so has the choreography around it. Both live in
# phoenix-release-tooling: the key inside its seal.yml, and everything a producer does around a seal
# — draft, ask, wait, prove, upload, undraft — inside its `@v1` action, which is the single step at
# the bottom of this file. All this workflow holds is a dispatch token that can ask for a signature
# and nothing else. `.tooling/docs/publishing.md` is the producer-facing contract that step
# implements — read it before changing anything here.
#
# The launcher PERSISTS this document: a published list replaces a client's mirror set wholesale, so
# an unsigned one means a single hostile answer permanently rewrites where that machine fetches
# every future release from. The signature is what makes the list worth obeying, and it is the same
# Ed25519 release key every payload is sealed with, made by the same one authority — the mod and the
# launcher ask for it from their own CI, this list asks for it from here, and only the base game is
# still signed by hand, offline. Only the producer differs.
#
# THIS PRODUCER CHOOSES NO SERIAL. It builds a document at `serial: 0` — which names no release —
# and the authority assigns `its ledger's high-water mark + 1`, writes that number into the
# document, signs THOSE bytes and answers on its `sealed` branch. What gets published is what comes
# back. There is no ledger read here, no arithmetic, and no number this run could get wrong.
#
# WHICH IS WHY THE TAG IS NOT `v<serial>` ANY MORE: the serial does not exist when the release has
# to be created. The tag is `list-<the 7-character sha of the commit being published>` — a name this
# repo already has at the top of the run, unique per commit, and stable across a re-run of the same
# commit. That stability is load-bearing: the authority answers a re-dispatch of byte-identical
# bytes under a tag it has already sealed with the seal it already made, spending no serial, so a
# run that died between the seal and the undraft is recovered by pressing re-run. It is only stable
# because `generate_mirror_list.py build` is deterministic — no clock, no serial, no directory
# order (see its docstring, and validate.yml, which checks it).
#
# There is no build-provenance attestation here, unlike dist's release workflow. Provenance exists
# to tie a compiled binary nobody can reproduce to the workflow that built it; this artifact is a
# small JSON document rendered deterministically from files in this repo, and the signature is what
# the reader actually checks.
#
# STEP ORDER IS LOAD-BEARING: every gate that can fail runs BEFORE anything is generated or asked
# for — an unset dispatch token or a `v1` that does not resolve costs seconds (see the Preflight).
# What used to follow it — the draft, the request, the wait, the proof, the undraft — is the action,
# which owns that order now and states its own guarantees in action.yml. The one this repo still
# depends on: the Release is a DRAFT until the sealed document and its signature are up and proven,
# and `releases/latest` (every reader's entry point) cannot see a draft.
#
# A push publishes ONLY IF THE DOCUMENT ACTUALLY CHANGED. The reason used to be key exposure; the
# key is gone and the reason is now the SERIAL. A dispatch spends one — the authority assigns and
# records the number whether or not this run ever publishes — so sealing a list because somebody
# fixed a typo in the README burns a serial and publishes a Release that says nothing new. Two
# README edits did exactly that before this gate existed.
#
# The gate compares the freshly built document against the PUBLISHED one, ignoring `serial` and
# `signed_at` (which the two sides can never agree on by construction, and which say nothing about
# the list). It is deliberately NOT a `paths:` filter. A path list is a second, hand-maintained copy
# of "what the document is made from" — `mirrors.d/` today, plus generate_mirror_list.py, plus
# whatever input gets added next — and the day one is forgotten, a merged registration is green and
# silently never published. That is the failure class this whole repo is built to refuse (see the
# generator's docstring). Comparing the rendered document asks the only question that matters, and
# no future input file can slip past it.
#
# Two rules keep the gate from becoming its own silent failure: a run that CANNOT tell whether the
# document changed fails loudly rather than guessing in either direction, and a rehearsal goes
# through the motions unconditionally, because rehearsing them is its entire job.
#
# NEVER interpolate `${{ }}` into a `run:` block. It is textual substitution performed before bash
# parses the script, so anything from the event is executable code — and one of these steps holds
# the dispatch token. Everything crossing that line goes through `env:` and is read as "$VAR".
on:
  push:
    branches: [main]
  # A HAND-RUN COMES IN TWO KINDS, and the input below is what chooses between them.
  #
  #   publish = false — REHEARSAL. Everything up to and including the request's own validation,
  #     then stop: the action's `dry-run` checks the document exactly as the authority will and
  #     creates, uploads and dispatches nothing. NOTHING IS DISPATCHED is the deliberate part — a
  #     dispatch spends a serial, so a rehearsal that asked for a signature would burn a number
  #     every time it ran. Run it after the dispatch token or this file changes.
  #
  #   publish = true — A REAL PUBLISH, asked for by hand: draft, dispatch, wait, prove, upload,
  #     undraft, the same as a push, subject to the same change gate. It is not a rehearsal in any
  #     sense and it spends a serial. It is also no longer how a line is STARTED: nothing here mints
  #     a first serial any more, because nothing here mints any serial — the authority counts from
  #     its own ledger and a first publish is simply the first request it has ever seen for
  #     `mirrors`.
  workflow_dispatch:
    inputs:
      publish:
        description: "PUBLISH for real from this manual run. Off = rehearse only, dispatch nothing."
        type: boolean
        default: false

permissions:
  contents: write        # the action creates the Release, uploads to it and undrafts it

# ONE publish at a time. Two runs overlapping — two pull requests merged minutes apart — would each
# read the same published list, and the loser would then compare its own document against a release
# that is already stale and either publish a list that omits the winner's mirror or skip one that
# should have shipped. Serialising the job makes the second run read the first one's result, which
# is the state it was always meant to compare against. `cancel-in-progress: false` because the run
# being cancelled is one that may already have been sealed — and a later run never supersedes an
# earlier one here, since each publishes its own document rather than a newer view of one shared
# thing.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Does this run publish? A push does, and so does a hand-run `publish = true`. A plain manual
      # run does not, and dispatches nothing (see the `on:` block above). Every step that publishes
      # keys off this one value rather than re-deriving what kind of run this is.
      PUBLISHING: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    steps:
      # Third-party actions are pinned to COMMIT SHAs, not tags. A tag is mutable, and every action
      # below runs in the same job as the dispatch token with `contents: write`. The trailing
      # comment is the human-readable version; update both together.
      #
      # The publishing step at the bottom is the deliberate exception: `@v1` is the moving major tag
      # every Phoenix producer references, and the trade — a fix in the tooling, or a rotation of
      # the public half a seal is proven against, reaching this repo without a commit of its own —
      # is argued in .tooling/docs/publishing.md. It is not a third-party action; it is the other
      # half of this project.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The tooling, for the PREFLIGHT only: this job no longer reads a ledger, verifies a signature
      # or installs a wheel — the action does all three, out of its own checkout. What this buys is
      # that `v1` resolving to a tree that cannot publish is a refusal in the first ten seconds
      # instead of a failure with a draft already up.
      #
      # `ref` is `v1`, the same moving tag the action below runs from, so this reads the tree that
      # will do the work — resolved a minute earlier, which is as close as a producer can get.
      # It used to be a pinned commit SHA; what a signature is PROVEN against now moves with `v1`
      # too (see the note on the publish step), so a pin here would only have described a tree
      # nothing in this job runs.
      #
      # It must run AFTER the checkout above, which cleans the workspace it lands in.
      - name: Fetch release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Pr0j3ctPh03nix/phoenix-release-tooling
          ref: v1
          path: .tooling

      # Everything that can refuse this publish, before anything is read, generated or asked for.
      - name: Preflight
        env:
          DISPATCH_TOKEN: ${{ secrets.PHOENIX_TOOLING_DISPATCH }}
        run: |
          set -euo pipefail
          # The three things the action needs from its own tree and this checkout can speak for:
          # the CLI it routes through, the public half it proves the answer against, and the
          # vendored wheels it installs the verifier from. Missing means `v1` points at a tree that
          # cannot publish — and the run would otherwise die after the draft was up, or worse,
          # after a signature had already been made.
          for f in .tooling/phx.py .tooling/keys/phoenix-active.pub .tooling/wheels/SHA256SUMS; do
            test -f "$f" || { echo "$f is missing — Pr0j3ctPh03nix/phoenix-release-tooling@v1 does not look like a release of the tooling"; exit 1; }
          done
          # Presence is not enough for the wheels: they are the code that decides whether the
          # signature that comes back is one clients will accept, and a verifier that can be made to
          # say yes is worth exactly as much as a leaked key. This re-hashes each one against
          # wheels/SHA256SUMS with no network.
          python .tooling/phx.py wheels check
          # The token that asks for a signature. The launcher obeys NO list it cannot verify, so a
          # mirror list that reaches publish without one is a document every client ignores — and
          # the symptom is not an error, it is mirrors that never appear. Checked on a rehearsal
          # too: not dispatching is the one thing a rehearsal cannot rehearse, so "the secret
          # exists" is all it has to offer.
          test -n "$DISPATCH_TOKEN" || {
            echo "secrets.PHOENIX_TOOLING_DISPATCH is not set, so nobody can be asked to seal this"
            echo "list — and this repository no longer holds a key to sign it with. Mint a"
            echo "fine-grained PAT scoped to Pr0j3ctPh03nix/phoenix-release-tooling with"
            echo "Actions: Read and write, and add it as that secret; see"
            echo ".tooling/docs/publishing.md."
            exit 1
          }

      # The generator's own rules, checked against each other before its output is trusted — and
      # before the gate below compares that output against anything. It needs nothing installed, so
      # it runs unconditionally: a broken generator should fail every run, not only the ones that
      # publish.
      - name: Selftest the generator
        run: python generate_mirror_list.py selftest

      # THE TAG, and with it the ledger directory this seal is filed under. `list-<sha7>` names the
      # commit whose mirrors.d is being published, which is the only thing about this release that
      # is known before the seal — the serial is not (see the header). Taken from GITHUB_SHA rather
      # than from `git rev-parse --short`, which is free to hand back more than seven characters to
      # keep an abbreviation unique: this string is a tag and a path, and it must be the same on
      # every re-run of the same commit or the whole idempotency argument goes with it.
      - name: Name this release
        run: |
          set -euo pipefail
          sha7=${GITHUB_SHA:0:7}
          echo "PHOENIX_TAG=list-$sha7" >> "$GITHUB_ENV"
          echo "PHOENIX_TITLE=mirror list $sha7" >> "$GITHUB_ENV"
          echo "publishing as list-$sha7"

      # The document, at serial 0 — a SEAL REQUEST. Nothing is passed in: the generator reads
      # mirrors.d/ and nothing else, which is what makes this byte-identical on a re-run.
      - name: Build the mirror list
        run: |
          set -euo pipefail
          python generate_mirror_list.py build --out mirrors.json
          cat mirrors.json

      # What is published right now, for the gate below and for nothing else. Asked of the release
      # LIST rather than of `releases/latest`: that endpoint 404s when there is none, and a 404 is
      # not distinguishable from an unreadable one by an exit code. Drafts and prereleases do not
      # count — a draft is invisible to every reader, so it is not a published list.
      #
      # `set -o pipefail` and the integer test are what make "cannot read" fail instead of falling
      # through: gh exits non-zero on an API failure, and the pipeline must not swallow it.
      # GITHUB_TOKEN is minted per run and scoped to this repository — exactly the access needed to
      # read its own releases, and no more.
      - name: Fetch the published list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published_count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                              --jq '.[] | select(.draft == false and .prerelease == false) | .id' \
                            | wc -l | tr -d '[:space:]')
          case "$published_count" in ''|*[!0-9]*) echo "could not count this repo's releases"; exit 1 ;; esac
          first=true
          if [ "$published_count" -gt 0 ]; then
            # The asset's API url, not its browser url: the latter is unauthenticated and 404s on a
            # private repository.
            asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
                      --jq '.assets[] | select(.name == "mirrors.json") | .url')
            [ -n "$asset" ] || { echo "the latest release carries no mirrors.json"; exit 1; }
            # It lands in RUNNER_TEMP because nothing downloaded is a file this repo authored.
            gh api "$asset" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/published.json"
            first=false
            echo "the published list is $(wc -c < "$RUNNER_TEMP/published.json") bytes"
          else
            # Reachable, and not an error: the first list this repo ever publishes, or one whose
            # releases were deleted. Neither can misnumber anything now — the authority counts from
            # its own ledger, which remembers every serial it ever sealed whether or not the run
            # that asked for it went on to publish.
            echo "nothing is published yet — there is no list to compare against"
          fi
          # Told to the gate explicitly rather than inferred from whether the file above exists: the
          # two questions ("was there anything published" and "did a download succeed") must not be
          # answered by one test.
          echo "PHOENIX_FIRST_PUBLISH=$first" >> "$GITHUB_ENV"

      # THE GATE. The step below it spends a serial at the authority and publishes a Release;
      # nothing above it does either. A push that changes no mirror therefore asks for no signature
      # and issues no number — which is the whole point, not a side effect of skipping work.
      - name: Decide whether this run asks for a seal
        run: |
          set -euo pipefail
          if [ "$PUBLISHING" != 'true' ]; then
            echo "REHEARSAL (publish = false) — going through the motions unconditionally:"
            echo "rehearsing the tooling, the wheels and the document is this run's entire job, so"
            echo "it must not be skipped for an unchanged list. Nothing is dispatched either way."
            seal=true
          elif [ "$PHOENIX_FIRST_PUBLISH" = 'true' ]; then
            echo "FIRST PUBLISH — there is no published list to compare against."
            seal=true
          else
            # The generator answers this, not a shell pipeline: WHICH fields carry meaning and which
            # are bookkeeping is a fact about the format, and the module that emits them is the one
            # that should own it — a second copy of that list here would be free to drift from the
            # document it describes. It is covered by `selftest`, which a pipeline could not be.
            #
            # It exits non-zero on anything it could not read, so a truncated or malformed published
            # document aborts the run under `set -e` instead of being quietly read as either answer:
            # "I cannot tell" must never resolve to "unchanged" (a silent non-publish) or to
            # "changed" (a serial spent for nothing).
            seal=$(python generate_mirror_list.py changed \
                     --published "$RUNNER_TEMP/published.json" --candidate mirrors.json)
            if [ "$seal" = 'true' ]; then
              echo "the list changed — this run publishes $PHOENIX_TAG"
              diff -u "$RUNNER_TEMP/published.json" mirrors.json || true
            else
              echo "the published list already says exactly this — nothing to seal, nothing to publish"
            fi
          fi
          echo "PHOENIX_SEAL=$seal" >> "$GITHUB_ENV"

      # The body quotes the document in full: it is small, and a reviewer reading the Release sees
      # the mirrors that were signed rather than a description of them. It quotes the REQUEST, which
      # is the attached document minus its serial — the number is written in by the authority and
      # cannot be known here, so the body names where to read it instead of guessing.
      - name: Compose the release body
        if: ${{ env.PHOENIX_SEAL == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "The signed mirror list, sealed with the Phoenix release key by"
            echo "\`Pr0j3ctPh03nix/phoenix-release-tooling\`."
            echo
            echo "Below is the list as built from this commit's \`mirrors.d/\`. The serial is"
            echo "assigned at sealing time — read it from the attached \`mirrors.json\`, which is"
            echo "the document that was actually signed."
            echo
            echo '```json'
            cat mirrors.json
            echo '```'
          } > release-notes.md
          cat release-notes.md

      # THE PUBLISH, and every step this file used to spell out for itself: draft, ask the signing
      # authority, wait, PROVE the answer against the public half clients pin, attach the sealed
      # document and its .minisig, undraft. Three producers ran their own copy of that choreography
      # and the copies had drifted; it is one step now, and its guarantees are stated in action.yml.
      #
      # No `assets`: this release has exactly two files, and both of them are what comes back from
      # the seal. Uploading the request here would put a document carrying `serial: 0` on the same
      # release as the sealed one — two answers to "what is the published list", one of which no
      # client would accept.
      #
      # `dry-run` on a rehearsal validates the request exactly as the authority will and stops
      # before anything is created, uploaded or dispatched.
      #
      # The ping the authority mints for this seal is delivered to nobody: a mirror's registration
      # lists the payload trees it serves (mod, launcher, game) and never the list itself, so the
      # action's own notify step finds no carrier and says so. That is a no-op, not a failure, and
      # it could not redden a published release even if it were one.
      - name: Publish the mirror list
        if: ${{ env.PHOENIX_SEAL == 'true' }}
        uses: Pr0j3ctPh03nix/phoenix-release-tooling@v1
        with:
          tag: ${{ env.PHOENIX_TAG }}
          title: ${{ env.PHOENIX_TITLE }}
          document: mirrors.json
          notes-file: release-notes.md
          token: ${{ github.token }}
          dispatch-token: ${{ secrets.PHOENIX_TOOLING_DISPATCH }}
          dry-run: ${{ env.PUBLISHING != 'true' }}

      # Says plainly that nothing shipped, so a green rehearsal is never mistaken for a publish —
      # and names the one thing that turns this run into a real one.
      - name: Rehearsal summary
        if: ${{ env.PUBLISHING != 'true' }}
        run: |
          echo "REHEARSAL — built $PHOENIX_TAG; nothing was dispatched and nothing published."
          echo "Exercised: the tooling at v1, its vendored wheels, the dispatch token's presence,"
          echo "the document, and the authority's own check of the seal request."
          echo "NOT exercised: the request itself, the signature and everything after it. A dispatch"
          echo "spends a serial — the authority assigns and records the number whether or not"
          echo "anything ships — so a rehearsal must never ask for one."
          echo "To publish from a manual run, run this workflow again with publish = true."
          ls -l mirrors.json

      # The other green ending, said just as plainly. A skipped publish and a broken one both leave
      # no new release, so the run has to state which it was — otherwise the only way to tell a
      # working gate from a silently failing publisher is to go reading step logs.
      - name: Nothing to publish
        if: ${{ env.PUBLISHING == 'true' && env.PHOENIX_SEAL != 'true' }}
        run: |
          echo "NOTHING PUBLISHED — the mirror list is byte-for-byte what the currently published"
          echo "release already says, so this run changed no mirror. No signature was asked for,"
          echo "and no serial was spent: the next run that does change the list will ask for one."
