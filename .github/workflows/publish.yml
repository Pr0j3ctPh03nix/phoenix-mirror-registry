name: publish

# Push to main -> build the mirror list, seal it with the release key, publish it as a Release.
#
# The launcher PERSISTS this document: a published list replaces a client's mirror set wholesale,
# so an unsigned one means a single hostile answer permanently rewrites where that machine fetches
# every future release from. The signature is what makes the list worth obeying, and it is the same
# Ed25519 release key every payload is sealed with, through the same one command
# (.tooling/tools/seal.py) — the mod in dist's CI, the launcher in its own, the base game by hand,
# and this. Only the producer differs.
#
# There is no build-provenance attestation here, unlike dist's release workflow. Provenance exists
# to tie a compiled binary nobody can reproduce to the workflow that built it; this artifact is a
# small JSON document rendered deterministically from files in this repo, and the signature is what
# the reader actually checks.
#
# STEP ORDER IS LOAD-BEARING, twice over:
#   * every gate that can fail runs BEFORE anything is generated or sealed — a missing secret or a
#     bad tooling pin costs seconds;
#   * the Release is created as a DRAFT and undrafted only once every asset is up. `releases/latest`
#     is the reader's entry point and a draft is invisible to it, so a client never observes a
#     release carrying a mirrors.json whose .minisig has not finished uploading — which is exactly
#     the document a client would then refuse and, worse, the interleaving that looks like an
#     attack.
#
# A push publishes ONLY IF THE DOCUMENT ACTUALLY CHANGED, and the reason is the signing key rather
# than tidiness: every publish puts PHOENIX_SIGNING_KEY into a runner, so sealing a release because
# somebody fixed a typo in the README is key exposure bought for nothing. Two README edits did
# exactly that before this gate existed.
#
# The gate compares the freshly built document against the PUBLISHED one, ignoring `serial` and
# `signed_at` (which differ on every run by construction and say nothing about the list). It is
# deliberately NOT a `paths:` filter. A path list is a second, hand-maintained copy of "what the
# document is made from" — `mirrors.d/` today, plus generate_mirror_list.py, plus whatever input
# gets added next — and the day one is forgotten, a merged registration is green and silently never
# published. That is the failure class this whole repo is built to refuse (see the generator's
# docstring). Comparing the rendered document asks the only question that matters, and no future
# input file can slip past it.
#
# Two rules keep the gate from becoming its own silent failure: a run that CANNOT tell whether the
# document changed fails loudly rather than guessing in either direction, and `workflow_dispatch`
# seals unconditionally, because proving the key and the pinned tooling still work is the entire
# job of the dry run.
#
# NEVER interpolate `${{ }}` into a `run:` block. It is textual substitution performed before bash
# parses the script, so anything from the event is executable code — and these steps hold the
# signing key. Everything crossing that line goes through `env:` and is read as "$VAR".
on:
  push:
    branches: [main]
  # DRY RUN. Everything up to and including the seal, then stop — nothing is published. Without it,
  # the first time PHOENIX_SIGNING_KEY is ever exercised in this repo is a real publish, which is a
  # poor moment to find out the organisation secret was never shared here. Run it from the Actions
  # tab after the secret, the pinned tooling ref, or this file changes.
  workflow_dispatch:
    inputs:
      seed:
        description: "Mint the FIRST serial. Only for a genuinely new line — see 'Compute the list serial'."
        type: boolean
        default: false

permissions:
  contents: write        # create the Release

# ONE publish at a time. The serial is derived by READING what is published, so two runs overlapping
# — two pull requests merged minutes apart — both read serial N and both derive N+1. The loser then
# collides on the tag and fails, which is loud and re-runnable, but it fails AFTER sealing and after
# creating a draft. Serialising the job makes the second run read the first one's published result,
# which is the number it was always meant to read. `cancel-in-progress: false` because the run being
# cancelled is one that may already have published — and a later run never supersedes an earlier one
# here, since each publishes its own document rather than a newer view of one shared thing.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A dry run stops before anything is published, so the publishing steps key off this one
      # value rather than each re-deriving what kind of run this is.
      PUBLISHING: ${{ github.event_name == 'push' }}
    steps:
      # WHICH number comes next is this producer's business, not the format's. The format says only
      # that a serial is a u64 (release-tooling's manifest_schema removed its SERIAL_FLOOR for
      # exactly this reason); ordering is enforced client-side by a per-payload high-water mark. So
      # the rule lives in the workflow that publishes.
      #
      # Derived from what is actually PUBLISHED, never counted alongside it. A `run_number + offset`
      # counter RESETS to 1 the day this file is renamed, and the reset is invisible in a diff: the
      # new number lands under the ratchet every installed client already holds, so the list is
      # refused by everyone who has one and nothing anywhere reports an error. The update simply
      # never appears. Reading the published number cannot lose its place, because it holds no
      # state to lose.
      #
      # TWO RULES, and both exist because a serial that goes backwards fails SILENTLY: the list
      # publishes green and every client holding the higher number refuses it, with nothing anywhere
      # reporting a problem.
      #
      #   COUNT FROM THE HIGH-WATER MARK, not from the latest release. Those differ precisely when
      #   the newest release was deleted — ordinary cleanup — after which `releases/latest` answers
      #   with an OLDER one and the next serial lands at or below a number already handed out. The
      #   tag IS the serial, so the mark is the largest `v<n>` this repo has ever carried, counting
      #   drafts and prereleases too: a draft left by a failed publish still NAMED a number.
      #
      #   NEVER SEED AUTOMATICALLY. "This line is new" and "somebody deleted the releases" look
      #   identical from inside the job, and the second one restarting at 1 is exactly the silent
      #   failure above. A push therefore refuses and explains; only a hand-run dispatch carrying
      #   `seed = true` may mint the first number. This is where it differs from dist's otherwise
      #   identical step, which forbids seeding outright because that line has always had releases.
      #
      # `set -o pipefail` and the integer test are what make "cannot read" fail instead of falling
      # through: gh exits non-zero on an API failure, and the pipeline must not swallow it. `gh`
      # needs no checkout, so this stays the first step. GITHUB_TOKEN is minted per run and scoped
      # to this repository — exactly the access needed to read its own releases, and no more.
      - name: Compute the list serial
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: '1'
          # Only a hand-run dispatch can carry this, so a push can never seed. See the refusal below.
          SEED_OK: ${{ github.event.inputs.seed }}
        run: |
          set -euo pipefail
          # The HIGHEST serial this line has ever named, across releases in ANY state — drafts and
          # prereleases included. `releases/latest` alone was wrong in a way that only shows up
          # afterwards: it is the newest by DATE, so deleting the newest release makes it answer with
          # an OLDER one, and the next serial is computed from that — at or below a number already
          # handed out, which every client that holds the higher one refuses forever.
          #
          # The tag IS the serial (`v<n>`, written by the publish step below), so this needs no
          # asset downloads, and a draft left behind by a failed publish still counts: it named a
          # number, and a number that was named must never be issued twice.
          high=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' \
                   | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                        --jq '.[] | select(.draft == false and .prerelease == false) | .id' | wc -l)
          if [ -z "$high" ]; then
            # SEEDING IS NEVER AUTOMATIC. "This line has no serial yet" and "somebody deleted the
            # releases" look identical from here, and guessing wrong restarts numbering below every
            # installed client's ratchet — a green publish nothing accepts, reporting nothing. So a
            # push refuses and says how to do it deliberately; only a hand-run dispatch may seed.
            if [ "$SEED_OK" != 'true' ]; then
              echo "no release in $GITHUB_REPOSITORY names a serial."
              echo "If this line is genuinely new, run this workflow from the Actions tab with"
              echo "  seed = true  to mint serial $SEED deliberately."
              echo "If it is NOT new, releases were deleted — seeding now would publish a list every"
              echo "existing client refuses. Restore them, or seed above the highest serial ever used."
              exit 1
            fi
            echo "SEEDING serial $SEED — asked for explicitly on a manual run"
            serial="$SEED"
            first=true
          else
            echo "highest serial ever named: $high ($published published release(s))"
            # The asset's API url, not its browser url: the latter is unauthenticated and 404s on a
            # private repository.
            asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
                      --jq '.assets[] | select(.name == "mirrors.json") | .url')
            [ -n "$asset" ] || { echo "the latest release carries no mirrors.json"; exit 1; }
            # SAVED, not just read for its serial: the change gate below compares against this exact
            # document, and fetching it twice would let the two reads disagree. It lands in
            # RUNNER_TEMP rather than the workspace because the checkout in the next step wipes the
            # workspace, and a file written here would go with it.
            gh api "$asset" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/published.json"
            prev=$(jq -r '.serial' "$RUNNER_TEMP/published.json")
            case "$prev" in ''|*[!0-9]*) echo "published serial is not a number: '$prev'"; exit 1 ;; esac
            # Counted from the HIGH-WATER MARK, not from whatever the latest release happens to
            # carry: those differ exactly when a newer release was deleted, which is the case this
            # whole block exists to survive.
            if [ "$prev" -gt "$high" ]; then high="$prev"; fi
            serial=$(( high + 1 ))
            first=false
            echo "latest published serial $prev, high-water $high -> this run would publish $serial"
          fi
          echo "PHOENIX_SERIAL=$serial" >> "$GITHUB_ENV"
          # Told to the gate explicitly rather than inferred from whether the file above exists: the
          # two questions ("was there anything published" and "did a download succeed") must not be
          # answered by one test, which is the same confusion the seed path above exists to avoid.
          echo "PHOENIX_FIRST_PUBLISH=$first" >> "$GITHUB_ENV"

      # Third-party actions are pinned to COMMIT SHAs, not tags. A tag is mutable, and every action
      # below runs in the same job as PHOENIX_SIGNING_KEY with `contents: write`. The trailing
      # comment is the human-readable version; update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The signer and the public key clients pin live in release-tooling — one copy shared by all
      # payloads instead of a copy per producer that has to be kept in step. This repo carries only
      # what it AUTHORS: the registrations and generate_mirror_list.py.
      #
      # `ref` is a COMMIT SHA, never a branch: signed bytes must name the exact revision that
      # sealed them, so a release stays reproducible and a change in release-tooling can never
      # silently reach a producer that did not ask for it. Bumping it is a deliberate, reviewable
      # commit here — and validate.yml resolves the same pin on the pull request that does it.
      #
      # It must run AFTER the checkout above, which cleans the workspace it lands in.
      - name: Fetch release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Pr0j3ctPh03nix/phoenix-release-tooling
          ref: 372fbace82ac673335350b59333ef7299469420d
          path: .tooling

      # The generator's own rules, checked against each other before its output is trusted — and
      # before the gate below compares that output against anything. It needs no key, so it runs
      # unconditionally: a broken generator should fail every run, not only the ones that publish.
      - name: Selftest the generator
        run: python generate_mirror_list.py selftest

      # `--signed-at` is supplied HERE and nowhere else. The generator never reads the clock, which
      # is what makes an unchanged mirrors.d render byte-identically; the run that knows a publish
      # is happening is the one that can honestly stamp it. The field is advisory — no reader may
      # fail on it — so it names the instant and carries no other meaning.
      - name: Build the mirror list
        run: |
          set -euo pipefail
          python generate_mirror_list.py build \
            --serial     "$PHOENIX_SERIAL" \
            --signed-at  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out        mirrors.json
          cat mirrors.json

      # THE GATE, and it sits here for one reason: everything below can see PHOENIX_SIGNING_KEY, and
      # nothing above it can. A push that changes no mirror therefore never puts the release key in
      # this runner at all — which is the whole point, not a side effect of skipping work.
      - name: Decide whether this run seals anything
        run: |
          set -euo pipefail
          if [ "$PUBLISHING" != 'true' ]; then
            echo "DRY RUN — sealing unconditionally: proving the key and the pinned tooling still work"
            echo "is this run's entire job, so it must not be skipped for an unchanged list."
            seal=true
          elif [ "$PHOENIX_FIRST_PUBLISH" = 'true' ]; then
            echo "FIRST PUBLISH — there is no published list to compare against."
            seal=true
          else
            # The generator answers this, not a shell pipeline: WHICH fields carry meaning and which
            # are bookkeeping is a fact about the format, and the module that emits them is the one
            # that should own it — a second copy of that list here would be free to drift from the
            # document it describes. It is covered by `selftest`, which a pipeline could not be.
            #
            # It exits non-zero on anything it could not read, so a truncated or malformed published
            # document aborts the run under `set -e` instead of being quietly read as either answer:
            # "I cannot tell" must never resolve to "unchanged" (a silent non-publish) or to
            # "changed" (a signature nobody needed).
            seal=$(python generate_mirror_list.py changed \
                     --published "$RUNNER_TEMP/published.json" --candidate mirrors.json)
            if [ "$seal" = 'true' ]; then
              echo "the list changed — this run publishes serial $PHOENIX_SERIAL"
              diff -u "$RUNNER_TEMP/published.json" mirrors.json || true
            else
              echo "the published list already says exactly this — nothing to sign, nothing to publish"
            fi
          fi
          echo "PHOENIX_SEAL=$seal" >> "$GITHUB_ENV"

      # The only non-stdlib dependency in the whole run, and it belongs to the signer, not to this
      # repo: generate_mirror_list.py is stdlib-only by design.
      #
      # NOT FETCHED, on the same principle as the action SHAs above: this step runs in the job that
      # holds PHOENIX_SIGNING_KEY, and `cryptography` is the code the key is handed to. This used to
      # be a hash-pinned requirements file, which fixed WHICH bytes were acceptable but still asked
      # an index for them while the key was a step away — the fetch, its TLS and PyPI's availability
      # all remained inputs to the run that signs. `--no-index` deletes the question instead of
      # constraining it: release-tooling vendors the wheels, so they arrive by the SAME pinned SHA
      # as the seal.py that uses them, reviewed in the same bump, and from here on this job's only
      # inputs are two git checkouts at pinned commit SHAs. It is also the one mechanism all three
      # producers now share, rather than this repo having its own.
      #
      # `wheels/` carries the signer's whole closure (cryptography, and the cffi -> pycparser it
      # imports through) for the interpreter this image ships — ubuntu-24.04, CPython 3.12. An image
      # that moves to another Python keeps exactly the property --require-hashes had: pip finds no
      # compatible wheel and this step fails, loudly and before the key is read, rather than
      # installing something unvendored. "Could not find a version that satisfies the requirement
      # ... (from versions: none)" is that failure, or a pinned SHA predating wheels/. How to
      # regenerate, and the rule that no wheel is committed whose sha256 was not cross-checked
      # against PyPI's own published digest, are in .tooling/wheels/README.md.
      - name: Install the signing dependency
        if: ${{ env.PHOENIX_SEAL == 'true' }}
        run: python -m pip install --disable-pip-version-check --no-index --find-links .tooling/wheels cryptography

      # Everything that can refuse this publish, before anything is sealed.
      #
      # It used to run before the document was built, on the principle that a gate should cost
      # seconds rather than a build. Building is instant and needs no key, so the order now follows
      # the stronger rule instead: no step that can see the signing key may run on a push that
      # publishes nothing. The cost of that trade is that a missing secret is discovered by the next
      # run that actually changes the list — which is what `workflow_dispatch` is for.
      - name: Preflight
        if: ${{ env.PHOENIX_SEAL == 'true' }}
        env:
          PHOENIX_SIGNING_KEY: ${{ secrets.PHOENIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Everything this workflow reaches into release-tooling for: the sealer, the signer it
          # calls, and the public half sealing proves against. Missing means that checkout did not
          # produce what this workflow expects — a moved path, or a pinned SHA from before these
          # files existed — and the run would otherwise die at the seal with the list already built.
          for f in .tooling/tools/seal.py .tooling/tools/phoenix_minisign.py \
                   .tooling/keys/phoenix-active.pub; do
            test -f "$f" || { echo "$f is missing — check the release-tooling ref pinned above"; exit 1; }
          done
          # The launcher obeys NO list it cannot verify, so a mirror list that reaches publish
          # without a key is a document every client ignores — and the symptom is not an error, it
          # is mirrors that never appear. Failing here, loudly, beats publishing something inert.
          # PHOENIX_SIGNING_KEY is an ORGANISATION secret shared to selected repositories; if this
          # fires on a run that used to work, this repository was dropped from that share list.
          test -n "$PHOENIX_SIGNING_KEY" || {
            echo "secrets.PHOENIX_SIGNING_KEY is not set — refusing to publish an unsigned mirror list"
            exit 1
          }

      # Seal: sign the document's exact bytes, and prove the signature verifies against the public
      # half clients pin. One command, shared with every other payload — see .tooling/tools/seal.py
      # for why the ORDER of those two steps is the whole point. The key is read from the
      # environment and never written to disk.
      #
      # `--manifest` is the flag's name because a manifest was its first caller; it signs a FILE's
      # raw bytes and knows nothing about what is in them, which is exactly why this format needed
      # no change there.
      - name: Seal the mirror list
        if: ${{ env.PHOENIX_SEAL == 'true' }}
        env:
          PHOENIX_SIGNING_KEY: ${{ secrets.PHOENIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python .tooling/tools/seal.py seal \
            --manifest mirrors.json \
            --pub      .tooling/keys/phoenix-active.pub \
            --trusted-comment "phoenix mirrors serial $PHOENIX_SERIAL"
          ls -l mirrors.json mirrors.json.minisig

      # The body quotes the document in full: it is small, and a reviewer reading the Release sees
      # the exact bytes that were signed rather than a description of them.
      - name: Compose the release body
        if: ${{ env.PHOENIX_SEAL == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "Mirror list serial \`$PHOENIX_SERIAL\`, sealed with the Phoenix release key."
            echo
            echo '```json'
            cat mirrors.json
            echo '```'
          } > release-notes.md
          cat release-notes.md

      # DRAFT: invisible to `releases/latest`, which is the reader's entry point, and invisible to
      # the serial step above — so a run that dies here leaves a draft that neither publishes a
      # half-uploaded list nor closes the seed path. `fail_on_unmatched_files` turns a missing
      # signature into a failed run rather than a release nobody can verify.
      - name: Publish Release (draft)
        if: ${{ env.PUBLISHING == 'true' && env.PHOENIX_SEAL == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ env.PHOENIX_SERIAL }}
          name: mirrors serial ${{ env.PHOENIX_SERIAL }}
          draft: true
          body_path: release-notes.md
          files: |
            mirrors.json
            mirrors.json.minisig
          fail_on_unmatched_files: true

      # The commit point. Everything above either succeeded or failed the job, and a failed job
      # leaves a draft behind — visible to us, invisible to every client — instead of a permanently
      # half-published list.
      - name: Undraft the Release
        if: ${{ env.PUBLISHING == 'true' && env.PHOENIX_SEAL == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$PHOENIX_SERIAL" --draft=false

      # Says plainly that nothing shipped, so a green dry run is never mistaken for a publish.
      - name: Dry run summary
        if: ${{ env.PUBLISHING != 'true' }}
        run: |
          echo "DRY RUN — sealed and verified as serial $PHOENIX_SERIAL, nothing published."
          echo "The signing secret, the pinned tooling and the whole producer chain all work."
          ls -l mirrors.json mirrors.json.minisig

      # The other green ending, said just as plainly. A skipped publish and a broken one both leave
      # no new release, so the run has to state which it was — otherwise the only way to tell a
      # working gate from a silently failing publisher is to go reading step logs.
      - name: Nothing to publish
        if: ${{ env.PUBLISHING == 'true' && env.PHOENIX_SEAL != 'true' }}
        run: |
          echo "NOTHING PUBLISHED — the mirror list is byte-for-byte what serial"
          echo "$(( PHOENIX_SERIAL - 1 )) already says, so this push changed no mirror."
          echo "No signature was made and the release key never entered this runner."
