name: validate

# Pull request -> build the mirror list and check it, and ASK FOR NO SIGNATURE.
#
# Sealing is the merge gate. A pull request that produced a signed artifact would let a
# registration reach clients with the review still open — and this repo's whole reason to exist is
# that the list a launcher PERSISTS is decided by a person, not by whoever opened a PR. So this
# workflow never reads the dispatch token, never asks the signing authority for anything, and runs
# with `contents: read`. A fork's pull request gets no secrets at all, which makes that guarantee
# structural as well as stated. This repository holds no release key at all now — sealing happens
# in phoenix-release-tooling, on request from a token this workflow does not have.
#
# NEVER interpolate `${{ }}` into a `run:` block. It is textual substitution performed before bash
# parses the script, so a branch name authored by a PR is executable code. Nothing below needs it.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to COMMIT SHAs, not tags: a tag is mutable, so an action
      # referenced by one is code that can change under a workflow that was reviewed once. The
      # trailing comment is the human-readable version; update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # This workflow neither seals nor verifies, so it needs none of these files to run. It checks
      # them out anyway, and `v1` is deliberately the SAME moving tag publish.yml resolves: what a
      # producer gets from this repository moves under it (the trade is argued in
      # .tooling/docs/publishing.md), so the only honest thing a pull request can check is that it
      # resolves to a tree that can publish, right now. Without this, a `v1` that does not — a bad
      # release of the tooling, a tag left pointing at something that never carried these paths — is
      # discovered by the publish run on main, after the merge, with the list already unpublishable.
      - name: Fetch release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Pr0j3ctPh03nix/phoenix-release-tooling
          ref: v1
          path: .tooling

      # The same three paths publish.yml's own preflight refuses to proceed without — this repo
      # authors its own document and takes nothing else from there; the signature is made by that
      # repo, not from a script copied out of it. The point is that a pull request which would fail
      # on main fails here instead, so the list follows what publish.yml checks rather than what
      # this workflow needs (it needs none of it).
      - name: Preflight the tooling
        run: |
          set -euo pipefail
          for f in .tooling/phx.py .tooling/keys/phoenix-active.pub .tooling/wheels/SHA256SUMS; do
            test -f "$f" || { echo "$f is missing — Pr0j3ctPh03nix/phoenix-release-tooling@v1 does not look like a release of the tooling"; exit 1; }
          done
          echo "the tooling at v1 is present"
          # Presence is not enough for the wheels: they are the code that decides on main whether a
          # returned signature is one clients will accept, and a verifier that can be made to say
          # yes is worth exactly as much as a leaked key. This re-hashes each one against
          # wheels/SHA256SUMS with no network, so it proves as much here as there.
          python .tooling/phx.py wheels check

      # The generator's own rules, checked against each other. It has no dependencies, so this is
      # the whole test suite and it runs before the registrations are read.
      - name: Selftest the generator
        run: python generate_mirror_list.py selftest

      # The registration helper is checked here too, and it can be for the same reason the generator
      # can: stdlib only, and its two outside edges — the network and git — are each behind one
      # function that its selftest replaces. So it installs nothing, reaches nothing, and needs no
      # git identity on the runner. It writes most registrations in this directory, which makes it a
      # producer of the very files the steps below refuse to publish when they are wrong.
      - name: Selftest the register helper
        run: python register_mirror.py selftest

      # This is the whole document a publish sends, not an approximation of one: every list this
      # generator writes is a seal request at serial 0, and the number it is published at is written
      # in by the signing authority (see the generator's docstring). So what a pull request builds
      # here is byte-for-byte what merging it would ask to have sealed, and what is being reviewed
      # is the mirror SET and nothing else.
      - name: Build the list
        run: |
          set -euo pipefail
          python generate_mirror_list.py build --out /tmp/mirrors.json
          cat /tmp/mirrors.json

      # Determinism is a promised property of the generator, so it is checked rather than asserted.
      # It buys two things now. A reviewer's: "the diff in the published list is the diff in
      # mirrors.d". And the publisher's, which is newer and sharper — the authority answers a
      # re-dispatch of byte-identical bytes with the seal it already made, spending no serial, so a
      # re-run of a publish that died mid-flight only recovers if this holds. The two ways it breaks
      # are both silent: a directory read in the OS's order, and a timestamp taken from the clock.
      - name: Rebuild and compare, byte for byte
        run: |
          set -euo pipefail
          python generate_mirror_list.py build --out /tmp/mirrors.again.json
          cmp /tmp/mirrors.json /tmp/mirrors.again.json
          echo "byte-identical across two runs"

      - name: Say plainly that nothing was signed
        run: echo "VALIDATED — nothing signed, nothing published. Merging to main is what publishes."
